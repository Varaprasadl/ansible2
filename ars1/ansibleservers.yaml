- name: cretae ec2 instance & r53 records
  hosts: local
  connection: local
  
  vars:
    ami: "ami-0055977a6e828a4f4"
    domain_name: "kamesh.store"
    instance: [ mongodb ,redis ]
    type: "create"
  tasks:
  - name: create EC2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{item}}"
      instance_type: "t3.micro"
      security_groups:
      - roboshop-common
      - "roboshop-{{item}}"
      image_id: "{{ami}}"
      state: present
    loop: "{{instance}}"
    register: ec2_output
    when: type=="create"

  - name: delete EC2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{item}}"
      instance_type: "t3.micro"
      security_groups:
      - roboshop-common
      - "roboshop-{{item}}"
      image_id: "{{ami}}"
      state: absent
    loop: "{{instance}}"
    when: type=="delete"

  # - name: print ec2 ec2_output
  #   debug:
  #     msg: "{{ec2_output}}"
  
  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{domain_name}}"
      record: "{{item.item}}.{{domain_name}}"
      type: A
      ttl: 1
      value: "{{item.instances[0].private_ip_address}}"
      overwrite: true
    loop: "{{ec2_output.results}}"
    when: type=="create"

  - name: create r53 records
    amazon.aws.route53:
      state: absent
      zone: "{{domain_name}}"
      record: "{{item}}.{{domain_name}}"
      type: A
      ttl: 1
    loop: "{{instance}}"
    when: type=="delete"
