- name: enable maven
  command: dnf module enable maven:3.9 -y

- name: install packages
  dnf:
    name:
    - maven 
    - java-25-openjdk-devel
    - maven-openjdk25
    - mysql
    state: present

- name: build application
  command: mvn clean package
  args:
    chdir: /app

- name: move shipping jar
  command: mv target/shipping.jar shipping.jar
  args:
    chdir: /app