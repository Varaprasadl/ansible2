- name: configure frontend server
  hosts: frontend
  become: yes
  tasks:
  - name: disable and enable nginx
    command: dnf module disable nginx -y

  - name: disable and enable nginx
    command: dnf module enable nginx:1.26 -y

  - name: install nginx
    package:
      name: nginx
      state: present

  - name: start & enable nginx
    service:
      name: nginx
      state: started
      enabled: yes

  - name: remove default countDocuments
    shell: rm -rf /usr/share/nginx/html/*

  - name: download the frontend
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/frontend-v4.zip
      dest: /tmp/frontend.zip

  - name: unzip the nginx
    unarchive:
      src: /tmp/frontend.zip
      dest: /usr/share/nginx/html/
      remote_src: yes

  - name: configure the reverse proxy
    template:
      src: roboshop.conf.j2
      dest: /etc/nginx/default.d/roboshop.conf

  - name: start the nginx service
    service:
      name: nginx
      state: restarted
      enabled: yes
