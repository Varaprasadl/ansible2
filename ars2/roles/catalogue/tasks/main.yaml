- name: nodejs app_setup
  include_role:
    name: common
    tasks_from: app_setup

- name: install nodejs
  include_role:
    name: common
    tasks_from: nodejs

- name: configure systemd service
  include_role:
    name: common
    tasks_from: systemd

- name: load mongo repo
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: install mongodb server
  dnf:
    name: mongodb-mongosh
    state: present

- name: check product community
  command: mongosh --host {{mongodb_host}} --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
  register: product_count

- name: print product countDocuments
  debug:
    msg: "{{product_count}}"

- name: load the products
  shell: mongosh --host {{mongodb_host}} < /app/db/master-data.js
  when: product_count.stdout | int ==0

- name: restart and enable nodejs
  include_role:
    name: common
    tasks_from: restart

