- name: app_setup
  include_role:
    name: common
    tasks_from: app_setup

- name: install java
  include_role:
    name: common
    tasks_from: java_setup

- name: check the cities count
  command: mysql -h {{mysql_host}} -uroot -pRoboShop@1 -N -B -e "SELECT COUNT(*) FROM cities.cities;"
  register: cities_count
  ignore_errors: true
  tags:
  - mysql

- name: print cities count
  debug:
    msg: "{{cities_count}}"
  tags:
  - mysql

- name: load the cities count
  shell: mysql -h {{mysql_host}} -uroot -pRoboShop@1 < /app/db/master-data.sql
  when: cities_count.rc != 0 or cities_count.stdout | int == 0
  register: taskout
  tags:
  - mysql

- name: print cities count
  debug:
    msg: "{{taskout}}"
  tags:
  - mysql

- name: create app user
  shell: mysql -h {{mysql_host}} -uroot -pRoboShop@1 < /app/db/app-user.sql
  tags:
  - mysql

- name: configure systemd service
  include_role:
    name: common
    tasks_from: systemd

- name: restart and enable
  include_role:
    name: common
    tasks_from: restart



