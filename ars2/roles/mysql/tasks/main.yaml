- name: configure mysql server
  hosts: mysql
  become: yes
  tasks:
  - name: enable mysql module
    command: dnf module enable mysql:8.4 -y

  - name: install mysql
    dnf:
      name: mysql-server
      state: present
    
  - name: Start & enable the MySQL service
    service:
      name: mysqld
      state: started
      enabled: yes

  - name: set root ansible_password
    command: mysql_secure_installation --set-root-pass {{mysql_password}}