- name: payment app_setup
  include_role:
    name: common
    tasks_from: app_setup

- name: install python
  include_role:
    name: common
    tasks_from: python_setup

- name: configure systemd service
  include_role:
    name: common
    tasks_from: systemd

- name: restart and enable
  include_role:
    name: common
    tasks_from: restart


